name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/368460337672/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-firebase-deployer@gen-lang-client-0573228910.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project gen-lang-client-0573228910 --non-interactive
